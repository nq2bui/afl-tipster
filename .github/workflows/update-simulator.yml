name: Update AFL Simulator Daily

on:
  schedule:
    # 9am AEST daily (11pm UTC previous day)
    - cron: '0 23 * * *'
    # 12pm AEST daily (2am UTC same day)
    - cron: '0 2 * * *'
    # 7pm AEST daily — after Thursday team announcements (9am UTC)
    - cron: '0 9 * * *'
    # 9pm AEST daily — late changes / confirmation (11am UTC)
    - cron: '0 11 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.3.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Run update script
        run: python update_simulator.py
        working-directory: ${{ github.workspace }}

      - name: Commit and push changes
        run: |
          git config user.name "AFL Tipster Bot"
          git config user.email "bot@aflchipster.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update: Round data & injuries $(date +'%d %b %Y')"
          git pull --no-rebase -X ours origin main --no-edit
          git push origin main
