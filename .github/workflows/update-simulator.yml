name: Update AFL Simulator Weekly

on:
  schedule:
    # Runs every Wednesday at ~10am AEST / ~11am AEDT (11pm UTC Tuesday)
    - cron: '0 23 * * 2'
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.3.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Run update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_simulator.py
        working-directory: ${{ github.workspace }}

      - name: Commit and push changes
        run: |
          git config user.name "AFL Tipster Bot"
          git config user.email "bot@aflchipster.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update: Round data & injuries $(date +'%d %b %Y')"
          git push
